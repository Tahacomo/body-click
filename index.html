<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>آناتومی هوشمند بدن</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
    <nav class="main-nav">
        <button id="nav-3d" class="active">شبیه‌ساز سه‌بعدی</button>
        <button id="nav-encyclopedia">دانشنامه اعضا</button>
    </nav>

    <div id="loading">
        <div class="loader"></div>
        <b id="status">در حال بارگذاری مدل...</b>
    </div>

    <main id="view-3d">
        <canvas id="scene"></canvas>
        <div class="legend-wrapper">
            <div id="legend" class="legend">
                <button data-region="head">سر</button>
                <button data-region="chest">قفسه سینه</button>
                <button data-region="abdomen">شکم</button>
                <button data-region="pelvis">لگن</button>
                <button data-region="armLeft">بازوی چپ</button>
                <button data-region="armRight">بازوی راست</button>
                <button data-region="legLeft">پای چپ</button>
                <button data-region="legRight">پای راست</button>
            </div>
        </div>
        <aside id="panel" hidden>
            <button id="close">×</button>
            <h2 id="title"></h2>
            <div id="content"></div>
        </aside>
    </main>

    <main id="view-encyclopedia" class="hidden">
        <div class="container">
            <h2 class="page-title">دانشنامه اعضای بدن</h2>
            <div id="organ-grid" class="organ-grid"></div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
