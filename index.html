<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>آناتومی هوشمند بدن</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
    <canvas id="scene"></canvas>
    
    <div id="loading">
        <div class="loader"></div>
        <b>در حال بارگذاری...</b>
    </div>

    <div class="top">
        <h1>آناتومی هوشمند بدن</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="جستجوی بیماری...">
            <button id="searchBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span>جستجو</span>
            </button>
        </div>
    </div>

    <div class="legend-wrapper">
        <div id="legend" class="legend">
            <button data-region="head">سر</button>
            <button data-region="chest">قفسه سینه</button>
            <button data-region="abdomen">شکم</button>
            <button data-region="pelvis">لگن</button>
            <button data-region="armLeft">بازوی چپ</button>
            <button data-region="armRight">بازوی راست</button>
            <button data-region="legLeft">پای چپ</button>
            <button data-region="legRight">پای راست</button>
        </div>
    </div>

    <aside id="panel" hidden>
        <button id="close">×</button>
        <h2 id="title"></h2>
        <div id="content"></div>
    </aside>

    <script type="module" src="script.js"></script>
</body>
</html>
