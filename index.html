<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Human Anatomy</title>
    <link rel="stylesheet" href="./style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="scene"></canvas>

    <div id="loadingScreen">
        <div class="loader"></div>
        <div>در حال بارگذاری مدل سه‌بعدی...</div>
    </div>

    <header class="topbar">
        <div>
            <h1>Human Anatomy</h1>
            <p>مدل سه‌بعدی تعاملی بدن انسان</p>
        </div>
        <div class="hint">برای چرخاندن مدل Drag کنید • برای زوم Scroll کنید</div>
    </header>

    <nav id="regionNav" class="region-nav"></nav>

    <aside id="panel" class="panel" hidden>
        <button id="panelClose" class="close-btn" aria-label="بستن">×</button>
        <h2 id="panelTitle">ناحیه</h2>
        <ul id="panelList"></ul>
    </aside>

    <script type="module" src="./script.js"></script>
</body>
</html>
