<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>آزمون آناتومی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="quiz-body">
    <div class="quiz-card">
        <!-- صفحه شروع -->
        <div id="quiz-start-screen">
            <div class="quiz-icon">🎓</div>
            <h2>آزمون تشخیص بیماری</h2>
            <p>دانش خود را در مورد اعضای بدن بسنجید.</p>
            <button id="start-quiz-btn" class="btn-primary">شروع رقابت</button>
            <a href="index.html" class="btn-link">بازگشت به خانه</a>
        </div>

        <!-- صفحه بازی -->
        <div id="quiz-game-screen" class="hidden">
            <div class="quiz-nav">
                <span id="q-number">۱</span> از ۱۰
                <button id="exit-early" class="btn-exit">پایان آزمون</button>
            </div>
            
            <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

            <img id="organ-img" class="organ-mini-img" src="" alt="راهنما">
            
            <h3 class="quiz-question">بیماری <span id="target-disease">...</span> مربوط به کدام عضو است؟</h3>
            
            <div id="quiz-options" class="options-list"></div>
            
            <div id="quiz-feedback" class="feedback-msg"></div>
        </div>

        <!-- صفحه نتیجه -->
        <div id="quiz-result-screen" class="hidden">
            <h2 id="result-emoji">✨</h2>
            <h3 id="result-title">نتیجه نهایی</h3>
            <div class="final-score-circle">
                <span id="final-score">۰</span>
            </div>
            <p style="color: #666;">امتیاز شما از ۱۰۰</p>
            <button onclick="location.reload()" class="btn-primary">آزمون مجدد</button>
            <a href="index.html" class="btn-link">خروج</a>
        </div>
    </div>

    <script src="quiz.js"></script>
</body>
</html>
